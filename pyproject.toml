
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbr-intelligence"
version = "0.1.0"
description = "AI-powered QBR document processing pipeline"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25,<2",
    "pdfplumber>=0.11,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "instructor>=1.7,<2",
    "openai>=1.60,<3",
    "langfuse>=3,<5",
    "pgvector>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "ruff>=0.9",
    "mypy>=1.14",
    "deepeval>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
